spring:
  profiles:
    active: pro
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
  flyway:
    enabled: false  # 彻底关闭 Flyway
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8003

# 轨迹设计：GA-optiGAN 调用 Python 脚本（相对路径以 api 模块启动目录 user.dir 为基准）
trajectory:
  optimization:
    # 必须指向已安装 numpy、torch 的解释器（勿用未装依赖的 Windows Store / Python 3.14 默认 python）
    # 示例: C:/Users/你的用户名/anaconda3/python.exe
    python-executable: python
    script-dir: ../gaoptgan
    ga-optigan-timeout-seconds: 7200

# 轨迹随钻评估：TCP 端口接收实时坐标，水平偏移超阈值时外推预测
while-drilling:
  tcp-port: 9010
  alert-distance-m: 30.0
  monte-carlo-samples: 100
  monte-carlo-stop-probability-threshold: 70.0
  monte-carlo-comprehensive-threshold-m: 35.0
  iscwsa-sigma-md: 0.6
  iscwsa-sigma-inc-deg: 0.2
  iscwsa-sigma-azi-deg: 0.3

---
spring:
  config:
    activate:
      on-profile: pro
  datasource:
  # 3307=301=Bupt@2023 lab-bendi-3306-Bupt@2023
